name: 爬蟲 + 部署到 GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每天台北時間 10:00(UTC 02:00)自動爬新活動並重新部署
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 排程觸發時先爬新活動,寫回 data/events.json
      - name: 執行生咖爬蟲
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 crawler/crawl.py || true
          if ! git diff --quiet data/events.json; then
            git config user.name "svt-cafe-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/events.json
            git commit -m "自動更新生咖活動資料"
            git push
          fi

      # 網頁版是輕量靜態頁(web_static/),在 LINE/IG 等內建瀏覽器也能秒開;
      # Flutter 程式碼保留給 iOS/Android 原生 App 使用
      - name: 組裝靜態網站
        run: |
          mkdir -p out/data
          cp web_static/index.html out/
          cp -r assets/avatars out/avatars
          cp data/events.json out/data/events.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
